name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag matches the app version
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "const version = \"$want\"" update.go || { echo "update.go version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: |
          mkdir -p out/LifePlanner
          GOOS=windows GOARCH=amd64 go build -tags noseed -trimpath -ldflags "-s -w -H windowsgui" -o out/LifePlanner/LifePlanner.exe .
          cd out
          cp LifePlanner/LifePlanner.exe .
          sha256sum LifePlanner.exe > LifePlanner.exe.sha256
          zip -qr LifePlanner.zip LifePlanner
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Life Planner ${GITHUB_REF_NAME#v}" --generate-notes \
            out/LifePlanner.zip out/LifePlanner.exe out/LifePlanner.exe.sha256
