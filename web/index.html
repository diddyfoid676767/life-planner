<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Planner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Life Planner</span></div>
  <nav id="tabs">
    <div class="navgroup">Plan</div>
    <button data-view="today" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
    <button data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <div class="navgroup">Study</div>
    <button data-view="study"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Study</span></button>
    <button data-view="school"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><span>Class mode</span></button>
    <button data-view="forest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l-6 9h3.5L6 16h12l-3.5-5H18z"/><path d="M12 16v6"/></svg><span>Forest</span></button>
    <div class="navgroup">Life</div>
    <button data-view="training"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 8L9 4l-3 8H2"/></svg><span>Training &amp; Health</span></button>
    <button data-view="arena"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 17.5L21 6V3h-3L6.5 14.5"/><path d="M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg><span>Arena</span></button>
    <button data-view="friends"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 14.2A5.5 5.5 0 0 1 21.5 19"/></svg><span>Friends</span></button>
    <button data-view="personal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Events &amp; Tasks</span></button>
    <button data-view="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg><span>Missed info</span></button>
    <div class="navspacer"></div>
    <button data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Settings</span></button>
  </nav>
  <div class="sidefoot">
    <div id="sideStats"></div>
    <button id="notifyBtn" class="small ghost" hidden>Turn on reminders</button>
    <span id="saveState" class="muted small-text"></span>
  </div>
</aside>
<div class="content">
<div id="updateBar" class="banner good" hidden></div>
<div id="focusBar" hidden></div>
<div id="offline" class="banner danger" hidden>The planner has stopped running. Double-click <b>LifePlanner.exe</b> again to reopen it. Changes made now won't be saved.</div>
<main id="view"></main>
</div>
<div id="toasts"></div>
<dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
<script src="forest.js"></script>
<script src="garden3d.js"></script>
<script src="game.js"></script>
<script src="critters.js"></script>
<script src="garden.js"></script>
<script src="setbacks.js"></script>
<script src="avatar.js"></script>
  <script src="arena.js"></script>
<script src="battle.js"></script>
<script src="arenabox.js"></script>
  <script src="board.js"></script>
  <script src="school.js"></script>
  <script src="setup.js"></script>
  <script src="strava.js"></script><script src="health.js"></script>
<script src="focusfx.js"></script>
<script src="theme.js"></script>
<script src="miniplayer.js"></script>
<script src="account.js"></script>
<script src="body.js"></script>
<script src="friends.js"></script>
<script src="challenges.js"></script>
<script src="quickadd.js"></script>
<script src="exams.js"></script>
<script src="app.js"></script>
</body>
</html>
